; Replaces the image's /etc/supervisor/conf.d/aimm.conf (mounted read-only).
; Differences from upstream: AIMM does NOT autostart (the control panel starts it on request), its web UI stays on
; 127.0.0.1 (upstream binds 0.0.0.0, which makes AIMM demand Facebook credentials), VNC listens on localhost only
; (upstream: all interfaces, no password), noVNC is started on demand by the agent, and a small control agent is added.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_GEOMETRY)s -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -forever -shared -localhost -rfbport %(ENV_VNC_PORT)s
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:agent]
command=/usr/local/bin/python -u /extras/agent.py
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:aimm]
command=/usr/local/bin/aimm --webui --webui-host 127.0.0.1 --webui-port 8467
environment=DISPLAY=":99",PYTHONPATH="/extras",AIMM_SESSION_FILE="/session/fb-state.json",AIMM_SESSION_STATUS="/session/status.json"
autostart=false
autorestart=unexpected
startsecs=15
startretries=3
stopwaitsecs=30
priority=40
stdout_logfile=/var/log/supervisor/aimm.log
stderr_logfile=/var/log/supervisor/aimm.err

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:%(ENV_VNC_PORT)s
autostart=false
autorestart=false
priority=50
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err
